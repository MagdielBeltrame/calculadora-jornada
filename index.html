
<!DOCTYPE html>  
<html lang="pt-BR">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Calculadora de jornada</title>  
    <!-- Fonte Inter para um design limpo e moderno -->  
    <link rel="preconnect" href="https://fonts.googleapis.com">  
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">  
    <style>  
    :root {  
        --bg-color: #f8fafc;  
        --card-bg: #ffffff;  
        --text-main: #0f172a;  
        --text-muted: #64748b;  
        --border-color: #e2e8f0;  
        --primary: #2563eb;  
        --primary-hover: #1d4ed8;  
        --green-bg: #f0fdf4;  
        --green-border: #bbf7d0;  
        --green-text: #15803d;  
        --red-bg: #fef2f2;  
        --red-border: #fecaca;  
        --red-text: #b91c1c;  
        --radius: 16px;  
    }  

    * {  
        box-sizing: border-box;  
        margin: 0;  
        padding: 0;  
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;  
    }  

    body {  
        background-color: var(--bg-color);  
        color: var(--text-main);  
        display: flex;  
        justify-content: center;  
        align-items: center;  
        min-height: 100vh;  
        padding: 20px 16px;  
    }  

    .container {  
        width: 100%;  
        max-width: 520px;  
        background: var(--card-bg);  
        border-radius: var(--radius);  
        padding: 28px 24px;  
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);  
        border: 1px solid var(--border-color);  
    }  

    header {  
        text-align: center;  
        margin-bottom: 24px;  
    }  

    header h1 {  
        font-size: 1.35rem;  
        font-weight: 800;  
        color: var(--text-main);  
        letter-spacing: -0.02em;  
        text-transform: uppercase;  
    }  

    header p {  
        font-size: 0.875rem;  
        color: var(--text-muted);  
        margin-top: 4px;  
    }  

    .inputs-grid {  
        display: grid;  
        grid-template-columns: 1fr;  
        gap: 16px;  
        margin-bottom: 20px;  
    }  

    .input-group {  
        display: flex;  
        flex-direction: column;  
        gap: 6px;  
    }  

    .input-group label {  
        font-size: 0.85rem;  
        font-weight: 600;  
        color: var(--text-main);  
    }  

    .input-group input,
    .input-group select {  
        width: 100%;  
        padding: 12px 16px;  
        font-size: 1.1rem;  
        font-weight: 600;  
        border: 1.5px solid var(--border-color);  
        border-radius: 10px;  
        outline: none;  
        transition: all 0.2s ease;  
        background-color: #f8fafc;  
        color: var(--text-main);  
        appearance: none;
    }  

    .select-wrapper {
        position: relative;
    }

    .select-wrapper::after {
        content: '▼';
        font-size: 0.75rem;
        color: var(--text-muted);
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
    }

    .input-group input:focus,
    .input-group select:focus {  
        border-color: var(--primary);  
        background-color: #ffffff;  
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);  
    }  

    .actions {  
        display: grid;  
        grid-template-columns: 1fr;  
        gap: 10px;  
        margin-bottom: 28px;  
    }  

    .btn {  
        padding: 12px 16px;  
        font-size: 0.95rem;  
        font-weight: 600;  
        border-radius: 10px;  
        border: none;  
        cursor: pointer;  
        transition: all 0.2s ease;  
    }  

    .btn-secondary {  
        background-color: #f1f5f9;  
        color: var(--text-muted);  
        border: 1px solid var(--border-color);  
    }  

    .btn-secondary:hover {  
        background-color: #e2e8f0;  
        color: var(--text-main);  
    }  

    .error-message {  
        background-color: var(--red-bg);  
        border: 1px solid var(--red-border);  
        color: var(--red-text);  
        padding: 10px 14px;  
        border-radius: 8px;  
        font-size: 0.85rem;  
        font-weight: 500;  
        margin-bottom: 20px;  
        display: none;  
    }  

    .results-section {  
        border-top: 1px dashed var(--border-color);  
        padding-top: 24px;  
    }  

    .results-section h2 {  
        font-size: 0.9rem;  
        font-weight: 700;  
        color: var(--text-muted);  
        text-transform: uppercase;  
        letter-spacing: 0.05em;  
        margin-bottom: 16px;  
        text-align: center;  
    }  

    .cards-grid {  
        display: grid;  
        grid-template-columns: 1fr;  
        gap: 12px;  
        margin-bottom: 20px;  
    }  

    .card {  
        padding: 16px 20px;  
        border-radius: 12px;  
        display: flex;  
        justify-content: space-between;  
        align-items: center;  
        border: 1px solid transparent;  
    }  

    .card-green {  
        background-color: var(--green-bg);  
        border-color: var(--green-border);  
    }  

    .card-red {  
        background-color: var(--red-bg);  
        border-color: var(--red-border);  
    }  

    .card-info {  
        display: flex;  
        flex-direction: column;  
    }  

    .card-title {  
        font-size: 0.8rem;  
        font-weight: 700;  
        text-transform: uppercase;  
    }  

    .card-green .card-title { color: var(--green-text); }  
    .card-red .card-title { color: var(--red-text); }  

    .card-subtitle {  
        font-size: 0.75rem;  
        color: var(--text-muted);  
        margin-top: 2px;  
    }  

    .card-value {  
        font-size: 1.8rem;  
        font-weight: 800;  
        letter-spacing: -0.03em;  
    }  

    .card-green .card-value { color: var(--green-text); }  
    .card-red .card-value { color: var(--red-text); }  

    .details-box {  
        background-color: #f8fafc;  
        border: 1px solid var(--border-color);  
        border-radius: 12px;  
        padding: 14px 16px;  
    }  

    .details-row {  
        display: flex;  
        justify-content: space-between;  
        font-size: 0.85rem;  
        padding: 6px 0;  
        color: var(--text-muted);  
    }  

    .details-row:not(:last-child) {  
        border-bottom: 1px solid #f1f5f9;  
    }  

    .details-row span:last-child {  
        font-weight: 600;  
        color: var(--text-main);  
    }  

    @media (min-width: 480px) {  
        .cards-grid {  
            grid-template-columns: 1fr 1fr;  
        }  

        .card {  
            flex-direction: column;  
            align-items: flex-start;  
            gap: 8px;  
        }  

        .card-value {  
            font-size: 2rem;  
            align-self: flex-end;  
        }  
    }  
</style>  
</head>  
<body>  
<div class="container">  
    <header>  
        <h1>Calculadora de jornada</h1>  
        <p>Controle de limite e horas extras</p>  
    </header>  

    <form id="calc-form" onsubmit="event.preventDefault();">  
        <div class="inputs-grid">  
            <div class="input-group">  
                <label for="jornada">Selecione sua jornada</label>  
                <div class="select-wrapper">
                    <select id="jornada" onchange="updateView(); calculate();">
                        <option value="8h48">Jornada 8h48</option>
                        <option value="6h00">Jornada 6h00</option>
                    </select>
                </div>
            </div>  

            <div class="input-group">  
                <label for="entrada">Horário de Entrada</label>  
                <input type="time" id="entrada" required oninput="calculate()">  
            </div>  
        </div>  

        <div class="actions">  
            <button type="button" class="btn btn-secondary" onclick="clearFields()">Limpar</button>  
        </div>  
    </form>  

    <div id="error-msg" class="error-message"></div>  

    <div class="results-section">  
        <h2>Seu Horário de Saída</h2>  

        <div class="cards-grid">  
            <div class="card card-green">  
                <div class="card-info">  
                    <span class="card-title" id="title-card-1">🟢 Com 1h Extra</span>  
                    <span class="card-subtitle" id="sub-card-1">9h48m trabalhadas</span>  
                </div>  
                <div class="card-value" id="res-1h">--:--</div>  
            </div>  

            <div class="card card-red">  
                <div class="card-info">  
                    <span class="card-title" id="title-card-2">🔴 Limite Máximo</span>  
                    <span class="card-subtitle" id="sub-card-2">10h00m trabalhadas (+1h12)</span>  
                </div>  
                <div class="card-value" id="res-1h12">--:--</div>  
            </div>  
        </div>  

        <div class="details-box" id="details-box">  
            <!-- Preenchido dinamicamente via JS -->
        </div>  
    </div>  
</div>  

<script>  
    // Utilitários de conversão de tempo  
    function timeToMinutes(timeStr) {  
        if (!timeStr) return null;  
        const [hours, minutes] = timeStr.split(':').map(Number);  
        return hours * 60 + minutes;  
    }  

    function minutesToTime(totalMinutes) {  
        // Garante rotação completa em relação às 24h (virada da noite)
        let mins = totalMinutes % (24 * 60);  
        if (mins < 0) mins += 24 * 60;  
          
        const hours = Math.floor(mins / 60);  
        const minutes = mins % 60;  
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;  
    }  

    function updateView() {
        const jornada = document.getElementById('jornada').value;
        const title1 = document.getElementById('title-card-1');
        const sub1 = document.getElementById('sub-card-1');
        const title2 = document.getElementById('title-card-2');
        const sub2 = document.getElementById('sub-card-2');
        const detailsBox = document.getElementById('details-box');

        if (jornada === '8h48') {
            title1.innerText = '🟢 Com 1h Extra';
            sub1.innerText = '9h48m trabalhadas';
            sub1.style.display = 'block';

            title2.innerText = '🔴 Limite Máximo';
            sub2.innerText = '10h00m trabalhadas (+1h12)';
            sub2.style.display = 'block';

            detailsBox.innerHTML = `
                <div class="details-row">
                    <span>Jornada normal:</span>
                    <span>8h 48min</span>
                </div>
                <div class="details-row">
                    <span>Intervalo considerado:</span>
                    <span>1h</span>
                </div>
                <div class="details-row">
                    <span>Hora extra:</span>
                    <span>1h</span>
                </div>
                <div class="details-row">
                    <span>Limite máximo:</span>
                    <span>1h 12min</span>
                </div>
            `;
        } else if (jornada === '6h00') {
            title1.innerText = '🟢 Jornada de 6h';
            sub1.innerText = '';
            sub1.style.display = 'none';

            title2.innerText = '🔴 Limite com Intervalo';
            sub2.innerText = '';
            sub2.style.display = 'none';

            detailsBox.innerHTML = `
                <div class="details-row">
                    <span>Jornada normal:</span>
                    <span>6h</span>
                </div>
                <div class="details-row">
                    <span>Intervalo:</span>
                    <span>15min</span>
                </div>
                <div class="details-row">
                    <span>Limite de trabalho:</span>
                    <span>6h</span>
                </div>
            `;
        }
    }

    function calculate() {  
        const entradaVal = document.getElementById('entrada').value;  
        const jornada = document.getElementById('jornada').value;
        const errorElement = document.getElementById('error-msg');  

        // Reseta mensagem de erro  
        errorElement.style.display = 'none';  
        errorElement.innerText = '';  

        // Se a entrada estiver vazia, volta os resultados para '--:--'
        if (!entradaVal) {  
            resetResults();  
            return;  
        }  

        const entrada = timeToMinutes(entradaVal);  
        let minutosSaida1, minutosSaida2;

        if (jornada === '8h48') {
            // 8h48m (Jornada) + 1h (Intervalo) + 1h (Extra) = 10h48m (648 min)
            const PERMANENCIA_1H_EXTRA = 10 * 60 + 48; 
            // 8h48m (Jornada) + 1h (Intervalo) + 1h12m (Extra Máxima) = 11h (660 min)
            const PERMANENCIA_LIMITE = 11 * 60; 

            minutosSaida1 = entrada + PERMANENCIA_1H_EXTRA;  
            minutosSaida2 = entrada + PERMANENCIA_LIMITE;  
        } else if (jornada === '6h00') {
            // 6h00m trabalhadas = entrada + 6h (360 min)
            const PERMANENCIA_6H = 6 * 60;
            // 6h00m trabalhadas + 15m intervalo = entrada + 6h15m (375 min)
            const PERMANENCIA_6H_INTERVALO = 6 * 60 + 15;

            minutosSaida1 = entrada + PERMANENCIA_6H;
            minutosSaida2 = entrada + PERMANENCIA_6H_INTERVALO;
        }

        // Exibição dos Resultados nos Cards  
        document.getElementById('res-1h').innerText = minutesToTime(minutosSaida1);  
        document.getElementById('res-1h12').innerText = minutesToTime(minutosSaida2);  
    }  

    function resetResults() {  
        document.getElementById('res-1h').innerText = '--:--';  
        document.getElementById('res-1h12').innerText = '--:--';  
    }  

    function clearFields() {  
        document.getElementById('calc-form').reset();  
        document.getElementById('error-msg').style.display = 'none';  
        updateView();
        resetResults();  
    }  

    // Inicialização da interface
    updateView();
</script>  
</body>  
</html>
